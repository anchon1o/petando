<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Petando!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: concerto de rock no estudio: luces, ruído, celebración de cada acerto
   IDEA: o escenario dun videoxogo musical (Rock Band) co pentagrama como pista
   PICTURE: a pista de notas iluminada ocupa a pantalla; faíscas ao acertar
   COLOUR and TYPE: noite de escenario, maxenta e ciano de focos, amarelo latón; Bowlby One SC + Nunito
   LAYOUT: unha columna, HUD de xogo arriba (puntos, multiplicador, público) */
:root{color-scheme:dark;--bg:#0b0816;--card:#17122b;--card2:#211a3d;--ink:#f3efff;--soft:#a59cc8;
--paper:#0e0a1f;--line:#c9c0f2;--mag:#ff2e88;--cy:#22e4ff;--yel:#ffd23f;--ok:#3dff8a;--mid:#ffb020;--verm:#ff3b5c;--brass:#ffd23f;--chip:#251d45}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background:radial-gradient(120% 60% at 15% -10%,rgba(255,46,136,.35),transparent 60%),radial-gradient(120% 60% at 90% -10%,rgba(34,228,255,.28),transparent 60%),radial-gradient(80% 40% at 50% 110%,rgba(255,210,63,.12),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:conic-gradient(from 160deg at 12% -5%,transparent 0 8deg,rgba(255,46,136,.10) 10deg 22deg,transparent 24deg),conic-gradient(from 170deg at 88% -5%,transparent 0 6deg,rgba(34,228,255,.09) 8deg 20deg,transparent 22deg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.brand{font-family:Bowlby One SC,Nunito,sans-serif;font-size:clamp(48px,13.5vw,110px);line-height:.95;white-space:nowrap;margin:22px 0 6px;color:#fff;
 text-shadow:0 0 6px #fff,0 0 18px var(--mag),0 0 42px var(--mag),4px 4px 0 #5a0f3a}
.brand span{color:var(--yel);text-shadow:0 0 6px #fff,0 0 18px var(--yel),0 0 40px #ff8a00}
h2{font-family:Bowlby One SC,Nunito,sans-serif;font-size:20px;font-weight:400;margin:28px 0 10px;line-height:1.1;color:var(--cy);text-shadow:0 0 12px rgba(34,228,255,.6)}
.sub{margin:0 0 8px;font-size:17px;color:var(--soft)}
.grow{flex:1}
.ib{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:500}
.ib:hover{border-color:var(--cy)}
.lang{position:relative}
.lang .menu{position:absolute;right:0;top:50px;background:var(--card2);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.lang.open .menu{display:flex}
.flag{width:30px;height:20px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.inst{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));padding:14px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}
.inst:hover,.inst:focus-visible{border-color:var(--yel);box-shadow:0 0 0 1px var(--yel),0 0 26px rgba(255,210,63,.35)}
.inst svg{width:100%;height:78px}
.inst img{width:100%;height:104px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#setIcon img{width:100%;height:100%;object-fit:contain}
#setIcon svg{width:100%;height:100%}
.fam{font:400 15px Bowlby One SC,Nunito,sans-serif;color:var(--soft);margin:18px 0 8px;letter-spacing:.03em}
.inst b{font-size:18px}
.inst small{color:var(--soft)}
.inst[disabled]{opacity:.45;cursor:default}
.inst[disabled] svg{filter:none}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.12);background:var(--chip);border-radius:999px;padding:9px 14px;min-height:44px;font-weight:500}
.chip[aria-pressed=true]{border-color:var(--mag);background:var(--mag);color:#fff;box-shadow:0 0 16px rgba(255,46,136,.6)}
.chip small{opacity:.75;font-weight:400;margin-left:4px}
.help{font-size:14px;color:var(--soft);margin:8px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.big{border:0;border-radius:14px;background:linear-gradient(180deg,#ff5aa2,var(--mag));color:#fff;font-weight:700;padding:12px 22px;min-height:48px;font-size:17px;box-shadow:0 0 22px rgba(255,46,136,.55),0 3px 0 #8a1048;text-transform:uppercase;letter-spacing:.02em}
.big.alt{background:linear-gradient(180deg,#5cf0ff,#12b8d6);color:#06101a;box-shadow:0 0 22px rgba(34,228,255,.45),0 3px 0 #0a6d80}
.tuner{display:flex;align-items:center;gap:14px;flex:1;min-width:220px}
.tn{font-family:Bowlby One SC,Nunito,sans-serif;font-size:30px;min-width:3.6em;line-height:1;color:#fff;text-shadow:0 0 10px rgba(34,228,255,.7)}
.tn small{display:block;font-family:Nunito;font-size:12px;color:var(--soft);margin-top:4px;white-space:nowrap;text-shadow:none}
.meter{position:relative;flex:1;height:30px;border-radius:8px;background:#0c0919;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.meter::before{content:"";position:absolute;left:40%;width:20%;top:0;bottom:0;background:rgba(61,255,138,.16)}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);opacity:.4}
.needle{position:absolute;top:3px;bottom:3px;width:6px;margin-left:-3px;border-radius:3px;background:var(--verm);left:50%;transition:left .08s linear,opacity .2s;box-shadow:0 0 10px var(--verm)}
.needle.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.lvl{height:6px;border-radius:3px;background:#0c0919;margin-top:10px;overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--yel),var(--verm))}
label.f{display:flex;align-items:center;gap:8px;font-size:15px}
select{font:inherit;min-height:44px;border-radius:10px;padding:0 10px;background:var(--chip);color:var(--ink);border:1px solid rgba(255,255,255,.12)}
input[type=range]{accent-color:var(--mag);width:140px;height:32px}
input[type=checkbox]{accent-color:var(--mag)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:var(--card);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.game:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--cy),0 0 24px rgba(34,228,255,.35)}
.game svg{display:block;width:100%;height:96px;background:radial-gradient(70% 120% at 50% 100%,rgba(255,46,136,.22),transparent),var(--paper);border-bottom:1px solid rgba(255,255,255,.08)}
.game div{padding:12px 14px 14px}
.game b{font-family:Bowlby One SC,Nunito,sans-serif;font-weight:400;font-size:20px;display:block}
.game p{margin:4px 0 0;font-size:15px;color:var(--soft)}
.game small{display:block;margin-top:6px;font-weight:500;color:var(--yel)}
.game[disabled]{opacity:.5;cursor:default;background:transparent;border-style:dashed}
.game[disabled] svg{display:none}
.msg{background:var(--verm);color:#fff;border-radius:12px;padding:10px 14px;margin-top:10px;display:none}
.msg.on{display:block}
#game .wrap{padding-top:8px}
.gtitle{font-family:Bowlby One SC,Nunito,sans-serif;font-size:22px;line-height:1}
.pts{font-family:Bowlby One SC,Nunito,sans-serif;font-size:24px;background:#000;border:1px solid rgba(255,210,63,.5);color:var(--yel);border-radius:12px;padding:6px 12px;min-width:86px;text-align:right;text-shadow:0 0 10px rgba(255,210,63,.8);font-variant-numeric:tabular-nums}
.mult{font-family:Bowlby One SC,Nunito,sans-serif;font-size:22px;border-radius:50%;width:48px;height:48px;display:none;align-items:center;justify-content:center;background:#000;border:2px solid var(--cy);color:var(--cy);text-shadow:0 0 8px var(--cy);box-shadow:0 0 16px rgba(34,228,255,.5)}
.mult.on{display:flex}.mult.x3{border-color:var(--mag);color:var(--mag);text-shadow:0 0 8px var(--mag);box-shadow:0 0 18px rgba(255,46,136,.6)}.mult.x4{border-color:var(--yel);color:var(--yel);text-shadow:0 0 10px var(--yel);box-shadow:0 0 22px rgba(255,210,63,.7);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.stage{background:radial-gradient(90% 70% at 50% 120%,rgba(255,46,136,.22),transparent 70%),radial-gradient(60% 60% at 50% -20%,rgba(34,228,255,.14),transparent),var(--paper);border-radius:18px;margin-top:10px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 40px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.6)}
.stage svg{display:block;width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crowd{position:absolute;right:8px;top:10px;bottom:10px;width:8px;border-radius:4px;background:linear-gradient(0deg,var(--verm),var(--yel) 45%,var(--ok));opacity:.85;display:none}
.crowd.on{display:block}
.crowd i{position:absolute;left:-5px;width:18px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff;transition:bottom .25s}
.sl{stroke:var(--line);stroke-width:1.2;opacity:.55}
.ink{fill:#fff}
.stem{stroke:#fff;stroke-width:1.7}
.hol{fill:none;stroke:#fff;stroke-width:2.2}
.ink,.hol,.stem{filter:drop-shadow(0 0 3px rgba(190,180,255,.8))}
.barl{stroke:var(--line);stroke-width:1.2;opacity:.35}
.dbar{fill:url(#gbar);opacity:.55}
.n-perfect .ink,.n-good .ink{fill:var(--ok)}.n-perfect .hol,.n-good .hol{stroke:var(--ok)}.n-perfect .stem,.n-good .stem{stroke:var(--ok)}
.n-perfect .ink,.n-perfect .hol,.n-perfect .stem,.n-good .ink,.n-good .hol{filter:drop-shadow(0 0 6px var(--ok))}
.n-ok .ink{fill:var(--mid)}.n-ok .hol{stroke:var(--mid)}.n-ok .stem{stroke:var(--mid)}
.n-miss .ink{fill:var(--verm)}.n-miss .hol{stroke:var(--verm)}.n-miss .stem{stroke:var(--verm)}
.n-miss{opacity:.6}
.n-perfect .dbar,.n-good .dbar{fill:var(--ok);opacity:.4}.n-miss .dbar{fill:var(--verm);opacity:.25}
.trace{fill:none;stroke:var(--mag);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--mag))}
.hitzone{fill:url(#ghz)}
.ph{stroke:var(--cy);stroke-width:3;filter:drop-shadow(0 0 6px var(--cy))}
.clefbg{fill:url(#gclef)}
.lab{font:700 16px Nunito,sans-serif;fill:var(--ink)}
.cnt{font:400 60px Bowlby One SC,Nunito,sans-serif;fill:var(--yel);filter:drop-shadow(0 0 12px var(--yel))}
.ghost{fill:var(--cy);filter:drop-shadow(0 0 6px var(--cy))}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
.hud .tuner{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 12px}
.stat{font-size:15px;color:var(--soft)}
.fb{font-family:Bowlby One SC,Nunito,sans-serif;font-size:clamp(24px,6vw,36px);text-align:center;min-height:1.4em;margin-top:10px;text-shadow:0 0 14px currentColor}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.rg{fill:#120d26;stroke-width:3}
.dart{fill:#fff;stroke:var(--cy);stroke-width:4;filter:drop-shadow(0 0 10px var(--cy))}
.stuck line{stroke:#fff;stroke-width:3;stroke-linecap:round}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.flash{animation:fl .35s}
@keyframes fl{0%{box-shadow:0 0 0 2px var(--ok),0 0 60px rgba(61,255,138,.7)}100%{box-shadow:0 0 40px rgba(0,0,0,.6)}}
.modal{position:fixed;inset:0;background:rgba(5,3,12,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto;border-color:rgba(255,46,136,.5);box-shadow:0 0 50px rgba(255,46,136,.35)}
.modal h3{font-family:Bowlby One SC,Nunito,sans-serif;font-weight:400;font-size:30px;margin:0;text-align:center;color:#fff;text-shadow:0 0 16px var(--mag)}
.stars{text-align:center;font-size:40px;letter-spacing:6px;margin:4px 0}
.stars i{font-style:normal;color:#3a315e}.stars i.on{color:var(--yel);text-shadow:0 0 14px var(--yel);display:inline-block;animation:pop .5s backwards}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kp div{background:#0c0919;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font-family:Bowlby One SC,Nunito,sans-serif;font-weight:400;font-size:22px;color:var(--cy)}
.kp span{font-size:13px;color:var(--soft)}
.tips{margin:8px 0 14px;padding-left:20px}
.tips li{margin:6px 0}
.hidden{display:none!important}
/* cómic */
.brand{font-size:clamp(42px,12.5vw,96px);letter-spacing:0;text-shadow:5px 5px 0 #000,0 0 18px var(--mag),0 0 40px var(--mag)}
.brand span{text-shadow:5px 5px 0 #000,0 0 18px var(--yel)}
h2{font-size:19px;letter-spacing:.01em;text-shadow:2px 2px 0 #000,0 0 12px rgba(34,228,255,.5)}
.fam{font-size:13px;letter-spacing:.04em}
.gtitle{font-size:21px;letter-spacing:0}
.card,.game,.inst{border:3px solid #000;box-shadow:5px 5px 0 #000}
.inst:hover,.inst:focus-visible{box-shadow:5px 5px 0 #000,0 0 0 3px var(--yel)}
.game:not([disabled]):hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000,0 0 0 3px var(--cy)}
.game b{font-size:18px;letter-spacing:0}
.stage{border:3px solid #000;box-shadow:7px 7px 0 #000}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.07) 1.1px,transparent 1.6px) 0 0/9px 9px}
.big{border:3px solid #000;box-shadow:4px 4px 0 #000;font-family:Bowlby One SC,Nunito,sans-serif;font-weight:400;font-size:16px;letter-spacing:.02em;text-transform:none}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.ib,.chip,select{border:2px solid #000}
.chip[aria-pressed=true]{box-shadow:3px 3px 0 #000}
.pts{border:3px solid #000;box-shadow:3px 3px 0 #000;font-size:21px}
.mult{font-size:17px}
.fb{min-height:66px;text-shadow:none;margin-top:14px}
.cap{display:inline-block;color:#0b0816;font-family:Bowlby One SC,Nunito,sans-serif;font-size:clamp(17px,4.6vw,24px);letter-spacing:0;padding:8px 18px;border:3px solid #000;box-shadow:4px 4px 0 #000;transform:rotate(-2deg);border-radius:6px}
.modal .card{border:3px solid #000;box-shadow:8px 8px 0 #000,0 0 40px rgba(255,46,136,.3)}
.modal h3{font-size:28px;letter-spacing:0;text-shadow:3px 3px 0 #000,0 0 16px var(--mag)}
.kp div{border:2px solid #000}
.kp b{font-size:19px}
.hud .tuner{border:3px solid #000;box-shadow:4px 4px 0 #000}
.tn{font-size:24px}
.rk{list-style:none;margin:8px 0 14px;padding:0;counter-reset:r}
.rk li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;counter-increment:r}
.rk li:nth-child(odd){background:#0c0919}
.rk li::before{content:counter(r);font-family:Bowlby One SC,Nunito,sans-serif;width:1.6em;color:var(--soft)}
.rk li:nth-child(1)::before{color:var(--yel);text-shadow:0 0 8px var(--yel)}
.rk li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk li b{font-family:Bowlby One SC,Nunito,sans-serif;font-weight:400;color:var(--cy);font-variant-numeric:tabular-nums}
.rk li.me{outline:1px solid var(--mag);box-shadow:0 0 14px rgba(255,46,136,.35)}
.nm{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.nm input{flex:1;min-width:150px;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0c0919;color:var(--ink);font:16px Nunito,sans-serif;padding:0 12px}
.sv{font-size:14px;color:var(--ok);margin:4px 0 8px}.sv.err{color:var(--verm)}
.hist{list-style:none;padding:0;margin:8px 0}.hist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}.hist li span{color:var(--soft)}
@media (prefers-reduced-motion:reduce){.pop,.flash,.stars i.on,.mult.x4{animation:none}.needle{transition:none}}
@media(max-width:600px){.kp b{font-size:18px}.tn{font-size:24px}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home"><div class="wrap">
  <div class="top"><div class="grow"></div><div class="lang" id="langBox"></div></div>
  <div class="brand">PETANDO<span>!</span></div>
  <p class="sub" data-i="appSub"></p>
  <h2 data-i="chooseInst"></h2>
  <div id="insts"></div>
</div></section>

<!-- SETUP -->
<section id="setup" class="hidden"><div class="wrap">
  <div class="top"><button class="ib" data-go="home" aria-label="back">←</button><div id="setIcon" style="width:64px;height:40px"></div><div class="gtitle grow" id="setTitle"></div><div class="lang" id="langBox2"></div></div>
  <h2 data-i="type"></h2>
  <div class="card"><div class="chips" id="types"></div><p class="help" data-i="typeHelp"></p></div>
  <h2 data-i="level"></h2>
  <div class="card"><div class="chips" id="levels"></div></div>
  <div id="patBox" class="hidden"><h2 data-i="pat"></h2><div class="card"><div class="chips" id="pats"></div><p class="help" data-i="patHelp"></p></div></div>
  <h2 data-i="tolL"></h2>
  <div class="card"><div class="chips" id="tols"></div><p class="help" data-i="tolHelp"></p></div>
  <h2 data-i="mic"></h2>
  <div class="card">
    <div class="row">
      <button class="big" id="micBtn" data-i="micOn"></button>
      <div class="tuner" id="tun1"><div class="tn">—<small>&nbsp;</small></div><div class="meter"><div class="needle"></div></div></div>
    </div>
    <div class="lvl" id="lvl1"><i></i></div>
    <div class="row" style="margin-top:12px">
      <label class="f"><span data-i="sens"></span><input type="range" id="sens" min="0" max="1" step="0.05"></label>
      <label class="f"><span data-i="a4"></span><select id="a4"><option>440</option><option>441</option><option>442</option><option>443</option></select></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="ib" id="noiseBtn" data-i="noiseB"></button><span class="help" id="noiseMsg" style="margin:0"></span></div><p class="help" data-i="tryVoice"></p>
    <div class="msg" id="micMsg"></div>
  </div>
  <h2 data-i="tools"></h2>
  <div class="games" id="tools"></div>
  <h2 data-i="games"></h2>
  <div class="games" id="games"></div>
</div></section>

<!-- GAME -->
<section id="game" class="hidden"><div class="wrap">
  <div class="top"><button class="ib" id="gBack" aria-label="back">←</button><div class="gtitle grow" id="gTitle"></div><div class="mult" id="gMult">×2</div><div class="pts" id="gPts">0</div></div>
  <div class="stage" id="stage"><svg id="gsvg"></svg><canvas id="fx"></canvas><div class="crowd" id="crowd"><i></i></div></div>
  <div class="fb" id="fb"></div>
  <div class="hud">
    <div class="tuner" id="tun2"><div class="tn">—<small>&nbsp;</small></div><div class="meter"><div class="needle"></div></div></div>
    <div class="stat" id="gStat"></div>
  </div>
  <div class="ctrl" id="gCtrl"></div>
</div></section>

<div class="modal" id="modal"><div class="card" id="mCard"></div></div>

<script>

  const x0=90,sp=Math.min(70,(w-x0-30)/Math.max(1,n-1));let g='';
  if(rev)P.forEach((q,k)=>g+=`<g class="n-perfect">${noteSVG(q.pos,q.a||null,x0+k*sp,1,!!q.a)}</g>`);
  const slots=P.map((q,k)=>{const c=this.cap[k],x=w/2+(k-(n-1)/2)*38;const col=c==null?'#251d45':c===q.midi?'#3dff8a':'#ff3b5c';return`<circle cx="${x}" cy="${h-26}" r="13" fill="${col}" stroke="#000" stroke-width="3"/>`+(c!=null&&c!==q.midi?`<text x="${x}" y="${h-20}" text-anchor="middle" style="font:800 17px Nunito,sans-serif;fill:#000">${c>q.midi?'↑':'↓'}</text>`:'')}).join('');
  svg.innerHTML=DEFS+staff(0,w)+clef(4)+g+slots+`<text x="12" y="24" class="lab">${t('first',{n:nname(P[0])})}</text><text x="${w-12}" y="24" text-anchor="end" class="lab">${t('phrases')} ${this.i+1}/${this.N}</text>`},
 start(){this.cap=[];this.tries=0;this.build(false);later(()=>this.play(),500)},
 play(){const P=this.ph[this.i],tr=typ().tr;this.state='play';this.cap=[];this.build(false);fb(t('listening'));PD.mute(P.length*.55+.5);P.forEach((q,k)=>later(()=>tone(q.midi-tr,.45),k*550));
  later(()=>{if(this.state==='play'){this.state='listen';this.cand=null;this.ct=0;this.sil=1;this.taken=false;this.nm=0;this.tL=performance.now();fb(t('yourTurn'))}},P.length*550+250)},
 update(p){const dt=dtOf(this);if(this.state!=='listen')return;
  const tg=this.ph[this.i][this.cap.length];
  if(p&&tg){this.sil=0;const d=p.w-tg.midi;let r;
   if(Math.abs(d)<=TOL())r=tg.midi;else if(Math.abs(d)<.75){r=null;this.nm+=dt;if(this.nm>.3){fb(dirMsg(d),'var(--verm)');this.nm=-.5}}else r=Math.round(p.w);
   if(r==null){this.ct=0;return}
   if(r===this.cand)this.ct+=dt;else{this.cand=r;this.ct=0;this.taken=false}
   if(this.ct>.12&&!this.taken){this.taken=true;this.nm=0;this.cap.push(r);this.capd=r-tg.midi;this.check()}}
  else if(p)this.sil=0
  else{this.sil+=dt;if(this.sil>.08){this.taken=false;this.cand=null}}},
 check(){const P=this.ph[this.i],k=this.cap.length-1;this.build(false);
  if(this.cap[k]!==P[k].midi){this.tries++;this.state='wrong';fb(dirMsg(this.capd),'var(--verm)');this.combo=0;setMult(1);later(()=>{this.cap=[];this.build(false);this.state='listen';fb(t('yourTurn'))},900);return}
  if(this.cap.length===P.length){this.state='hit';if(!this.tries){this.first++;this.combo++}const mu=Math.min(4,1+Math.floor(this.combo/2));setMult(mu);const rl=(performance.now()-this.tL)/1000;this.score+=(S.speed?Math.max(5,Math.round(250*P.length/(1+rl))-this.tries*40):(this.tries?50:120))*mu;setPts(this.score);
   fb(S.speed?`${rl.toFixed(1)} s`:this.tries?t('good'):t('perfect'),'var(--ok)');ding();flash();this.build(true);FX.burst(W()/2,200,'#3dff8a',30,5);later(()=>this.next(true),1600)}},
 next(){this.i++;if(this.i>=this.N)return this.finish();this.start()},
 finish(){this.state='end';modal(t('result'),[[t('score'),this.score],[t('firstTry'),this.first+'/'+this.N],[t('phrases'),this.N]],[],()=>this.round(),null,Math.max(1,Math.min(5,Math.round(this.first/this.N*5))))},
 stop(){this.state='end'}};

/* ===== RANKING ===== */
const RK={g:'g1',
 init(){svg.setAttribute('viewBox','0 0 10 0');svg.setAttribute('height',0);this.draw()},
 async draw(){ctrl('');const st=$('#stage');
  const chips=(arr,curV,attr)=>`<div class="chips" style="margin-bottom:10px">${arr.map(([v,l])=>`<button class="chip" ${attr}="${v}" aria-pressed="${v===curV}">${l}</button>`).join('')}</div>`;
  $('#gStat').textContent='';
  let box=$('#rkBox');if(!box){box=document.createElement('div');box.id='rkBox';box.className='card';box.style.marginTop='10px';st.after(box)}
  if(!gamesOf().includes(this.g))this.g='g1';box.innerHTML=chips(gamesOf().map(x=>[x,gname(x)]),this.g,'data-rg')+chips(LEVELS.map((l,i)=>[i,t('L'+i)]),S.level,'data-rl')+
   `<p class="help" style="margin:0">${t('i_'+S.inst)} · ${tlab(typ())} · ${t('player')}: <b>${esc(S.name||'—')}</b> <button class="ib" id="rkName" style="min-height:36px;margin-left:6px">${t('change')}</button></p><div id="rkList"><p class="sv">…</p></div>`;
  box.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{this.g=b.dataset.rg;this.draw()});
  box.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{S.level=+b.dataset.rl;save();this.draw()});
  $('#rkName').onclick=()=>{$('#rkList').innerHTML=`<div class="nm"><input id="rkIn" maxlength="24" value="${esc(S.name||'')}"><button class="big alt" id="rkOk">${t('saveB')}</button></div>`;$('#rkOk').onclick=()=>{const v=$('#rkIn').value.trim().slice(0,24);if(v){S.name=v;save()}this.draw()}};
  try{const top=await topList(this.g,S.level,typ().id);let mine=[];
   if(S.name)mine=await sb(`toca_resultados?select=puntos,precision,created_at&xogo=eq.${this.g}&nivel=eq.${S.level}&tipo=eq.${typ().id}&xogador=eq.${encodeURIComponent(S.name)}&order=created_at.desc&limit=10`);
   const L=$('#rkList');if(!L)return;L.innerHTML=`<h2 style="margin-top:14px">${t('top')} 10</h2>${rankHTML(top,S.name)}`+(S.name?`<h2>${t('myLast')}</h2>${mine.length?`<ul class="hist">${mine.map(r=>`<li><span>${new Date(r.created_at).toLocaleString(S.lang,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><b>${r.puntos}${r.precision!=null?` · ${r.precision}%`:''}</b></li>`).join('')}</ul>`:`<p class="help">${t('empty')}</p>`}`:'')}
  catch(e){console.warn(e);const L=$('#rkList');L&&(L.innerHTML=`<p class="sv err">${t('offline')}</p>`)}},
 update(){},stop(){const b=$('#rkBox');b&&b.remove()}};
const GAMES={g1:R,g2:X,g3:D,f1:TN,f2:DY,f3:FL,f4:EC,tu:TU,me:ME,rk:RK};
function loop(){requestAnimationFrame(loop);FX.step();const p=PD.on?PD.read():null;
 if(NC.on&&PD.on){NC.v.push(PD.rms||0);if(performance.now()-NC.t>1600){NC.on=false;const v=NC.v.sort((a,b)=>a-b);S.noise=v[Math.floor(v.length*.9)]||0;save();$('#noiseMsg').textContent=t('noiseOk')}}
 if(PD.on){const lvEl=$('#lvl1 i');if(lvEl)lvEl.style.width=Math.min(100,(PD.rms||0)*900)+'%';
  if(!$('#setup').classList.contains('hidden'))tuner($('#tun1'),p)}
 if(cur){PD.on&&tuner($('#tun2'),p);cur.update&&cur.update(p)}}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{if(cur===TN&&TN.state!=='run')TN.build();else if(cur===FL&&FL.state==='run')FL.build();else if(cur===OS&&OS.state==='run')OS.build();else if(cur===EC)EC.build(EC.state==='hit');else if(cur===TU)TU.build();else if(cur===ME)ME.build();else if(cur===X)X.build();else if(cur===D){D.build();D.info()}else if(cur===R&&!R.running)R.draw()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__toca={PD,S,startGame,GAMES,parse,INSTR,FL,OS,render,setClef,DET};
}
