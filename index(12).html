<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petando!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: concerto de rock no estudio: luces, ruído, celebración de cada acerto
   IDEA: o escenario dun videoxogo musical (Rock Band) co pentagrama como pista
   PICTURE: a pista de notas iluminada ocupa a pantalla; faíscas ao acertar
   COLOUR and TYPE: noite de escenario, maxenta e ciano de focos, amarelo latón; Bungee + Rubik
   LAYOUT: unha columna, HUD de xogo arriba (puntos, multiplicador, público) */
:root{color-scheme:dark;--bg:#0b0816;--card:#17122b;--card2:#211a3d;--ink:#f3efff;--soft:#a59cc8;
--paper:#0e0a1f;--line:#c9c0f2;--mag:#ff2e88;--cy:#22e4ff;--yel:#ffd23f;--ok:#3dff8a;--mid:#ffb020;--verm:#ff3b5c;--brass:#ffd23f;--chip:#251d45}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background:radial-gradient(120% 60% at 15% -10%,rgba(255,46,136,.35),transparent 60%),radial-gradient(120% 60% at 90% -10%,rgba(34,228,255,.28),transparent 60%),radial-gradient(80% 40% at 50% 110%,rgba(255,210,63,.12),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:conic-gradient(from 160deg at 12% -5%,transparent 0 8deg,rgba(255,46,136,.10) 10deg 22deg,transparent 24deg),conic-gradient(from 170deg at 88% -5%,transparent 0 6deg,rgba(34,228,255,.09) 8deg 20deg,transparent 22deg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.brand{font-family:Bungee,Rubik,sans-serif;font-size:clamp(48px,13.5vw,110px);line-height:.95;white-space:nowrap;margin:22px 0 6px;color:#fff;
 text-shadow:0 0 6px #fff,0 0 18px var(--mag),0 0 42px var(--mag),4px 4px 0 #5a0f3a}
.brand span{color:var(--yel);text-shadow:0 0 6px #fff,0 0 18px var(--yel),0 0 40px #ff8a00}
h2{font-family:Bungee,Rubik,sans-serif;font-size:20px;font-weight:400;margin:28px 0 10px;line-height:1.1;color:var(--cy);text-shadow:0 0 12px rgba(34,228,255,.6)}
.sub{margin:0 0 8px;font-size:17px;color:var(--soft)}
.grow{flex:1}
.ib{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:500}
.ib:hover{border-color:var(--cy)}
.lang{position:relative}
.lang .menu{position:absolute;right:0;top:50px;background:var(--card2);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.lang.open .menu{display:flex}
.flag{width:30px;height:20px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.inst{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));padding:14px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}
.inst:not([disabled]){border-color:var(--yel);box-shadow:0 0 0 1px var(--yel),0 0 26px rgba(255,210,63,.35)}
.inst:not([disabled])::after{content:"";position:absolute;inset:-40% 30% 40% 30%;background:radial-gradient(closest-side,rgba(255,210,63,.25),transparent);pointer-events:none}
.inst svg{width:100%;height:78px;filter:drop-shadow(0 0 8px rgba(255,210,63,.5))}
.inst b{font-size:18px}
.inst small{color:var(--soft)}
.inst[disabled]{opacity:.45;cursor:default}
.inst[disabled] svg{filter:none}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.12);background:var(--chip);border-radius:999px;padding:9px 14px;min-height:44px;font-weight:500}
.chip[aria-pressed=true]{border-color:var(--mag);background:var(--mag);color:#fff;box-shadow:0 0 16px rgba(255,46,136,.6)}
.chip small{opacity:.75;font-weight:400;margin-left:4px}
.help{font-size:14px;color:var(--soft);margin:8px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.big{border:0;border-radius:14px;background:linear-gradient(180deg,#ff5aa2,var(--mag));color:#fff;font-weight:700;padding:12px 22px;min-height:48px;font-size:17px;box-shadow:0 0 22px rgba(255,46,136,.55),0 3px 0 #8a1048;text-transform:uppercase;letter-spacing:.02em}
.big.alt{background:linear-gradient(180deg,#5cf0ff,#12b8d6);color:#06101a;box-shadow:0 0 22px rgba(34,228,255,.45),0 3px 0 #0a6d80}
.tuner{display:flex;align-items:center;gap:14px;flex:1;min-width:220px}
.tn{font-family:Bungee,Rubik,sans-serif;font-size:30px;min-width:3.6em;line-height:1;color:#fff;text-shadow:0 0 10px rgba(34,228,255,.7)}
.tn small{display:block;font-family:Rubik;font-size:12px;color:var(--soft);margin-top:4px;white-space:nowrap;text-shadow:none}
.meter{position:relative;flex:1;height:30px;border-radius:8px;background:#0c0919;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.meter::before{content:"";position:absolute;left:40%;width:20%;top:0;bottom:0;background:rgba(61,255,138,.16)}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);opacity:.4}
.needle{position:absolute;top:3px;bottom:3px;width:6px;margin-left:-3px;border-radius:3px;background:var(--verm);left:50%;transition:left .08s linear,opacity .2s;box-shadow:0 0 10px var(--verm)}
.needle.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.lvl{height:6px;border-radius:3px;background:#0c0919;margin-top:10px;overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--yel),var(--verm))}
label.f{display:flex;align-items:center;gap:8px;font-size:15px}
select{font:inherit;min-height:44px;border-radius:10px;padding:0 10px;background:var(--chip);color:var(--ink);border:1px solid rgba(255,255,255,.12)}
input[type=range]{accent-color:var(--mag);width:140px;height:32px}
input[type=checkbox]{accent-color:var(--mag)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:var(--card);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.game:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--cy),0 0 24px rgba(34,228,255,.35)}
.game svg{display:block;width:100%;height:96px;background:radial-gradient(70% 120% at 50% 100%,rgba(255,46,136,.22),transparent),var(--paper);border-bottom:1px solid rgba(255,255,255,.08)}
.game div{padding:12px 14px 14px}
.game b{font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:20px;display:block}
.game p{margin:4px 0 0;font-size:15px;color:var(--soft)}
.game small{display:block;margin-top:6px;font-weight:500;color:var(--yel)}
.game[disabled]{opacity:.5;cursor:default;background:transparent;border-style:dashed}
.game[disabled] svg{display:none}
.msg{background:var(--verm);color:#fff;border-radius:12px;padding:10px 14px;margin-top:10px;display:none}
.msg.on{display:block}
#game .wrap{padding-top:8px}
.gtitle{font-family:Bungee,Rubik,sans-serif;font-size:22px;line-height:1}
.pts{font-family:Bungee,Rubik,sans-serif;font-size:24px;background:#000;border:1px solid rgba(255,210,63,.5);color:var(--yel);border-radius:12px;padding:6px 12px;min-width:86px;text-align:right;text-shadow:0 0 10px rgba(255,210,63,.8);font-variant-numeric:tabular-nums}
.mult{font-family:Bungee,Rubik,sans-serif;font-size:22px;border-radius:50%;width:48px;height:48px;display:none;align-items:center;justify-content:center;background:#000;border:2px solid var(--cy);color:var(--cy);text-shadow:0 0 8px var(--cy);box-shadow:0 0 16px rgba(34,228,255,.5)}
.mult.on{display:flex}.mult.x3{border-color:var(--mag);color:var(--mag);text-shadow:0 0 8px var(--mag);box-shadow:0 0 18px rgba(255,46,136,.6)}.mult.x4{border-color:var(--yel);color:var(--yel);text-shadow:0 0 10px var(--yel);box-shadow:0 0 22px rgba(255,210,63,.7);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.stage{background:radial-gradient(90% 70% at 50% 120%,rgba(255,46,136,.22),transparent 70%),radial-gradient(60% 60% at 50% -20%,rgba(34,228,255,.14),transparent),var(--paper);border-radius:18px;margin-top:10px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 40px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.6)}
.stage svg{display:block;width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crowd{position:absolute;right:8px;top:10px;bottom:10px;width:8px;border-radius:4px;background:linear-gradient(0deg,var(--verm),var(--yel) 45%,var(--ok));opacity:.85;display:none}
.crowd.on{display:block}
.crowd i{position:absolute;left:-5px;width:18px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff;transition:bottom .25s}
.sl{stroke:var(--line);stroke-width:1.2;opacity:.55}
.ink{fill:#fff}
.stem{stroke:#fff;stroke-width:1.7}
.hol{fill:none;stroke:#fff;stroke-width:2.2}
.ink,.hol,.stem{filter:drop-shadow(0 0 3px rgba(190,180,255,.8))}
.barl{stroke:var(--line);stroke-width:1.2;opacity:.35}
.dbar{fill:url(#gbar);opacity:.55}
.n-perfect .ink,.n-good .ink{fill:var(--ok)}.n-perfect .hol,.n-good .hol{stroke:var(--ok)}.n-perfect .stem,.n-good .stem{stroke:var(--ok)}
.n-perfect .ink,.n-perfect .hol,.n-perfect .stem,.n-good .ink,.n-good .hol{filter:drop-shadow(0 0 6px var(--ok))}
.n-ok .ink{fill:var(--mid)}.n-ok .hol{stroke:var(--mid)}.n-ok .stem{stroke:var(--mid)}
.n-miss .ink{fill:var(--verm)}.n-miss .hol{stroke:var(--verm)}.n-miss .stem{stroke:var(--verm)}
.n-miss{opacity:.6}
.n-perfect .dbar,.n-good .dbar{fill:var(--ok);opacity:.4}.n-miss .dbar{fill:var(--verm);opacity:.25}
.trace{fill:none;stroke:var(--mag);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--mag))}
.hitzone{fill:url(#ghz)}
.ph{stroke:var(--cy);stroke-width:3;filter:drop-shadow(0 0 6px var(--cy))}
.clefbg{fill:url(#gclef)}
.lab{font:700 16px Rubik,sans-serif;fill:var(--ink)}
.cnt{font:400 72px Bungee,Rubik,sans-serif;fill:var(--yel);filter:drop-shadow(0 0 12px var(--yel))}
.ghost{fill:var(--cy);filter:drop-shadow(0 0 6px var(--cy))}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
.hud .tuner{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 12px}
.stat{font-size:15px;color:var(--soft)}
.fb{font-family:Bungee,Rubik,sans-serif;font-size:clamp(24px,6vw,36px);text-align:center;min-height:1.4em;margin-top:10px;text-shadow:0 0 14px currentColor}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.rg{fill:#120d26;stroke-width:3}
.dart{fill:#fff;stroke:var(--cy);stroke-width:4;filter:drop-shadow(0 0 10px var(--cy))}
.stuck line{stroke:#fff;stroke-width:3;stroke-linecap:round}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.flash{animation:fl .35s}
@keyframes fl{0%{box-shadow:0 0 0 2px var(--ok),0 0 60px rgba(61,255,138,.7)}100%{box-shadow:0 0 40px rgba(0,0,0,.6)}}
.modal{position:fixed;inset:0;background:rgba(5,3,12,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto;border-color:rgba(255,46,136,.5);box-shadow:0 0 50px rgba(255,46,136,.35)}
.modal h3{font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:30px;margin:0;text-align:center;color:#fff;text-shadow:0 0 16px var(--mag)}
.stars{text-align:center;font-size:40px;letter-spacing:6px;margin:4px 0}
.stars i{font-style:normal;color:#3a315e}.stars i.on{color:var(--yel);text-shadow:0 0 14px var(--yel);display:inline-block;animation:pop .5s backwards}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kp div{background:#0c0919;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:22px;color:var(--cy)}
.kp span{font-size:13px;color:var(--soft)}
.tips{margin:8px 0 14px;padding-left:20px}
.tips li{margin:6px 0}
.hidden{display:none!important}
.rk{list-style:none;margin:8px 0 14px;padding:0;counter-reset:r}
.rk li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;counter-increment:r}
.rk li:nth-child(odd){background:#0c0919}
.rk li::before{content:counter(r);font-family:Bungee,Rubik,sans-serif;width:1.6em;color:var(--soft)}
.rk li:nth-child(1)::before{color:var(--yel);text-shadow:0 0 8px var(--yel)}
.rk li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk li b{font-family:Bungee,Rubik,sans-serif;font-weight:400;color:var(--cy);font-variant-numeric:tabular-nums}
.rk li.me{outline:1px solid var(--mag);box-shadow:0 0 14px rgba(255,46,136,.35)}
.nm{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.nm input{flex:1;min-width:150px;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0c0919;color:var(--ink);font:16px Rubik,sans-serif;padding:0 12px}
.sv{font-size:14px;color:var(--ok);margin:4px 0 8px}.sv.err{color:var(--verm)}
.hist{list-style:none;padding:0;margin:8px 0}.hist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}.hist li span{color:var(--soft)}
@media (prefers-reduced-motion:reduce){.pop,.flash,.stars i.on,.mult.x4{animation:none}.needle{transition:none}}
@media(max-width:600px){.kp b{font-size:18px}.tn{font-size:24px}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home"><div class="wrap">
  <div class="top"><div class="grow"></div><div class="lang" id="langBox"></div></div>
  <div class="brand">PETANDO<span>!</span></div>
  <p class="sub" data-i="appSub"></p>
  <h2 data-i="chooseInst"></h2>
  <div class="insts" id="insts"></div>
</div></section>

<!-- SETUP -->
<section id="setup" class="hidden"><div class="wrap">
  <div class="top"><button class="ib" data-go="home" aria-label="back">←</button><div class="gtitle grow" data-i="i_tpt"></div><div class="lang" id="langBox2"></div></div>
  <h2 data-i="type"></h2>
  <div class="card"><div class="chips" id="types"></div><p class="help" data-i="typeHelp"></p></div>
  <h2 data-i="level"></h2>
  <div class="card"><div class="chips" id="levels"></div></div>
  <h2 data-i="mic"></h2>
  <div class="card">
    <div class="row">
      <button class="big" id="micBtn" data-i="micOn"></button>
      <div class="tuner" id="tun1"><div class="tn">—<small>&nbsp;</small></div><div class="meter"><div class="needle"></div></div></div>
    </div>
    <div class="lvl" id="lvl1"><i></i></div>
    <div class="row" style="margin-top:12px">
      <label class="f"><span data-i="sens"></span><input type="range" id="sens" min="0" max="1" step="0.05"></label>
      <label class="f"><span data-i="a4"></span><select id="a4"><option>440</option><option>441</option><option>442</option><option>443</option></select></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="ib" id="noiseBtn" data-i="noiseB"></button><span class="help" id="noiseMsg" style="margin:0"></span></div><p class="help" data-i="tryVoice"></p>
    <div class="msg" id="micMsg"></div>
  </div>
  <h2 data-i="tools"></h2>
  <div class="games" id="tools"></div>
  <h2 data-i="games"></h2>
  <div class="games" id="games"></div>
</div></section>

<!-- GAME -->
<section id="game" class="hidden"><div class="wrap">
  <div class="top"><button class="ib" id="gBack" aria-label="back">←</button><div class="gtitle grow" id="gTitle"></div><div class="mult" id="gMult">×2</div><div class="pts" id="gPts">0</div></div>
  <div class="stage" id="stage"><svg id="gsvg"></svg><canvas id="fx"></canvas><div class="crowd" id="crowd"><i></i></div></div>
  <div class="fb" id="fb"></div>
  <div class="hud">
    <div class="tuner" id="tun2"><div class="tn">—<small>&nbsp;</small></div><div class="meter"><div class="needle"></div></div></div>
    <div class="stat" id="gStat"></div>
  </div>
  <div class="ctrl" id="gCtrl"></div>
</div></section>

<div class="modal" id="modal"><div class="card" id="mCard"></div></div>

<script>
{
/* ---------- glyphs (FreeSerif, GPL+FE) ---------- */
const CLEF="M434 2Q464 -103 464 -170Q464 -223 427 -257Q390 -291 337 -291Q287 -291 250 -262Q213 -232 213 -190Q213 -160 234 -134Q254 -107 284 -107Q313 -107 332 -128Q350 -150 350 -178Q350 -240 280 -240Q298 -268 338 -268Q353 -268 368 -264Q384 -259 401 -248Q418 -237 428 -214Q439 -190 439 -157Q439 -136 411 -6Q389 -12 356 -12Q259 -12 190 60Q120 132 120 232Q120 267 132 303Q143 339 158 366Q172 394 200 428Q229 463 248 484Q268 504 303 539Q280 621 280 689Q280 779 313 840Q346 900 379 900Q389 900 402 887Q414 874 426 851Q438 828 446 790Q455 753 455 710Q455 551 342 447L368 329Q384 332 397 332Q458 332 500 282Q542 233 542 162Q542 44 434 2ZM426 746Q426 801 394 801Q358 801 333 748Q308 695 308 630Q308 588 321 557Q359 580 392 640Q426 699 426 746ZM498 128Q498 183 466 216Q434 249 383 249L428 23Q498 52 498 128ZM407 17 361 247Q334 241 312 214Q289 187 289 158Q289 143 295 128Q301 114 310 104Q318 94 327 86Q336 78 342 74Q348 71 348 71L340 66Q307 75 278 106Q248 137 248 184Q248 231 278 270Q307 310 343 323L325 430Q168 299 168 177Q168 104 223 55Q278 6 348 6Q365 6 407 17Z",SHARP="M365 24 319 6V-193L275 -209V-10L138 -63V-262L94 -279V-80L50 -96V0L94 17V262L50 245V341L94 358V589L138 606V376L275 429V659L319 675V446L365 464V366L319 348V104L365 122ZM275 88V332L138 279V34Z",FLAT="M222 441Q275 441 302 408Q329 375 329 317Q329 273 300 234Q270 195 192 117Q115 39 56 -34V783L99 802V402Q148 441 222 441ZM232 308Q232 373 183 373Q159 373 134 358Q110 344 99 319V87Q159 155 196 214Q232 274 232 308Z",NAT="M324 -273 280 -290V3L56 -87V656L99 675V344L324 433ZM280 93V328L99 254V19Z";

const PD={on:false,ctx:null,an:null,buf:null,hist:[],muteT:0,
 async start(){if(this.on)return true;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();await this.ctx.resume();
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=this.ctx.createMediaStreamSource(st);this.an=this.ctx.createAnalyser();this.an.fftSize=2048;src.connect(this.an);this.buf=new Float32Array(2048);this.on=true;return true}catch(e){console.warn(e);return false}},
 actx(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume();return this.ctx},
 mute(sec){this.muteT=Math.max(this.muteT,this.ctx.currentTime+sec);this.hist=[]},
 read(){const b=this.buf;this.an.getFloatTimeDomainData(b);let r=0;for(let i=0;i<b.length;i++)r+=b[i]*b[i];r=Math.sqrt(r/b.length);this.rms=r;
  const thr=Math.max(.002+(1-S.sens)*.04,(S.noise||0)*3);if(r<thr||this.ctx.currentTime<this.muteT){this.hist=[];return null}
  const f=yin(b,this.ctx.sampleRate);if(!f){this.hist.length&&this.hist.shift();return null}
  const c=69+12*Math.log2(f/S.a4);this.hist.push(c);if(this.hist.length>5)this.hist.shift();
  const sorted=[...this.hist].sort((a,b)=>a-b),med=sorted[sorted.length>>1];
  return{c:med,w:med+typ().tr,rms:r}}};
function yin(b,sr){const W=1024,tMin=Math.floor(sr/2100),tMax=Math.min(W-1,Math.floor(sr/65));const d=new Float32Array(tMax+1);
 for(let tau=tMin;tau<=tMax;tau++){let s=0;for(let j=0;j<W;j++){const x=b[j]-b[j+tau];s+=x*x}d[tau]=s}
 let run=0;for(let tau=1;tau<tMin;tau++){let s=0;for(let j=0;j<W;j++){const x=b[j]-b[j+tau];s+=x*x}run+=s}
 const cm=new Float32Array(tMax+1);for(let tau=tMin;tau<=tMax;tau++){run+=d[tau];cm[tau]=run>0?d[tau]*tau/run:1}
 let T=-1;for(let tau=tMin+1;tau<tMax;tau++){if(cm[tau]<.15){while(tau+1<tMax&&cm[tau+1]<cm[tau])tau++;T=tau;break}}
 if(T<0){let mn=1,mi=-1;for(let tau=tMin+1;tau<tMax;tau++)if(cm[tau]<mn){mn=cm[tau];mi=tau}if(mn<.3)T=mi;else return 0}
 const a=cm[T-1],c=cm[T],e=cm[T+1],den=a-2*c+e,sh=den?(a-e)/(2*den):0;return sr/(T+sh)}
function tone(m,dur=1.1,vol=.28){const c=PD.actx(),t0=c.currentTime+.02,f=S.a4*2**((m-69)/12);
 const g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=2;
 fl.frequency.setValueAtTime(f*1.2,t0);fl.frequency.linearRampToValueAtTime(f*5,t0+.07);fl.frequency.linearRampToValueAtTime(f*3,t0+.3);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.05);g.gain.setValueAtTime(vol*.8,t0+dur-.15);g.gain.linearRampToValueAtTime(0,t0+dur);
 const o1=c.createOscillator(),o2=c.createOscillator(),lf=c.createOscillator(),lg=c.createGain();o1.type='sawtooth';o2.type='square';o1.frequency.value=f;o2.frequency.value=f;o2.detune.value=4;

 o1.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);g.connect(c.destination);[o1,o2,lf].forEach(o=>{o.start(t0);o.stop(t0+dur+.05)})}

   const up=[],dn=[];for(let k=0;k<=10;k++){const tt=s.t0+(s.t1-s.t0)*k/10,v=s.a+(s.b-s.a)*k/10;up.push(`${(tt*this.pps).toFixed(1)},${yL(v+.12).toFixed(1)}`);dn.unshift(`${(tt*this.pps).toFixed(1)},${yL(v-.12).toFixed(1)}`)}
   g+=`<polygon points="${up.concat(dn).join(' ')}" fill="#a35bff" fill-opacity=".3" stroke="#a35bff" stroke-opacity=".7"/>`;
   if(s.lab)g+=`<text x="${x0+6}" y="${yL(Math.max(s.a,s.b)+.12)-8}" style="font:italic 700 ${s.lab.length<3?22:15}px Georgia,serif;fill:#fff">${s.lab}</text>`}
  svg.innerHTML=DEFS+['pp','p','mf','f','ff'].map((l,i)=>`<line x1="0" x2="${w}" y1="${yL(i*.2+.0)}" y2="${yL(i*.2)}" stroke="#c9c0f2" stroke-opacity=".08"/>`).join('')+
   `<g id="dyG" transform="translate(${this.ph},0)">${g}<polyline id="dyTr" class="trace" points=""/></g><rect class="hitzone" x="${this.ph-18}" y="0" width="36" height="${h}"/><circle id="dyD" cx="${this.ph}" cy="${h+20}" r="10" fill="#22e4ff" style="filter:drop-shadow(0 0 10px #22e4ff)"/><text id="dyM" x="${w-12}" y="26" text-anchor="end" class="lab"></text>`;this.trail=[]},
 cal(){this.state='calP';this.buf=[];this.tc=0;fb(t('calP'),'var(--cy)')},
 go(){this.course=this.gen();this.build();this.state='run';this.t0=performance.now()+1500;this.lev=0;this.n=0;this.inb=0;this.diff=0;fb(t('ready'));crowd(.5);this.cr=.5},
 update(p){const dt=dtOf(this),db=20*Math.log10((PD.rms||0)+1e-9),snd=!!p;
  if(this.state==='calP'||this.state==='calF'){if(snd){this.buf.push(db);this.tc+=dt}$('#dyM').textContent=Math.round(this.tc/2.5*100)+'%';
   if(this.tc>=2.5){const v=this.buf.sort((a,b)=>a-b)[this.buf.length>>1];
    if(this.state==='calP'){this.pDb=v;this.state='calF';this.buf=[];this.tc=0;fb(t('calF'),'var(--mag)')}
    else{if(v-this.pDb<6){fb(t('calBad'),'var(--verm)');this.state='idle'}else{S.dyn={p:this.pDb,f:v};save();fb(t('calOk'),'var(--ok)');this.state='idle'}$('#dyM').textContent=''}}return}
  if(this.state!=='run')return;const tt=(performance.now()-this.t0)/1000;if(tt<0)return;if(tt>0&&tt<.1)fb('');
  const raw=snd?.2+.6*(db-S.dyn.p)/(S.dyn.f-S.dyn.p):0;this.lev+=(Math.max(0,Math.min(1,raw))-this.lev)*.25;
  $('#dyG').setAttribute('transform',`translate(${this.ph-tt*this.pps},0)`);$('#dyD').setAttribute('cy',this.yL(this.lev));
  if(snd){this.trail.push(`${(tt*this.pps).toFixed(1)},${this.yL(this.lev).toFixed(1)}`);if(this.trail.length%3===0)$('#dyTr').setAttribute('points',this.trail.join(' '))}else if(this.trail.length&&this.trail[this.trail.length-1]!=='')this.trail.push('');
  const g=this.tgt(tt);if(g!=null){this.n++;const ok=snd&&Math.abs(this.lev-g)<.12;if(ok)this.inb++;if(snd)this.diff+=this.lev-g;$('#dyD').setAttribute('fill',ok?'#3dff8a':'#22e4ff');
   this.cr=Math.max(0,Math.min(1,this.cr+(ok?.004:-.004)));crowd(this.cr);setPts(Math.round(this.inb/6));if(ok&&this.inb%60===0)FX.burst(this.ph,this.yL(this.lev),'#3dff8a',12,3)}
  if(tt>this.course.T)this.finish()},

  modal(t('result'),[[t('score'),sc],[t('inBand'),pct+'%'],[t('secs'),Math.round(this.course.T)]],[md>.08?t('tipLoud'):md<-.08?t('tipSoft'):t('tipDynOk')],()=>this.go(),null,pct>=85?5:pct>=70?4:pct>=50?3:pct>=30?2:1)},
 stop(){this.state='end'}};

/* ===== FLEXIBILIDADES ===== */
const FL={
 init(){this.round()},
 round(){const pats=[[0,1,0],[0,1,2,1,0],[0,1,2,3,2,1,0]][S.level],HM=[60,67,72,76,79],CB=['0','2','1','12','23','13','123'];
  this.groups=CB.map((c,k)=>({k,c,notes:pats.map(i=>fromMidi(HM[i]-k,k===2||k===4))}));this.gi=0;this.ni=0;this.times=[];this.score=0;this.combo=0;setMult(1);this.hold=0;
  ctrl(`<button class="ib" id="flS">${t('skip')}</button>`);$('#flS').onclick=()=>this.adv(false);setPts(0);fb(t('play'));this.build();this.tA=performance.now()},
 build(){const w=W(),h=270,G0=this.groups[this.gi],n=G0.notes.length;this.w=w;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('height',h);
  const x0=90,sp=Math.min(80,(w-x0-30)/Math.max(1,n-1));this.xs=G0.notes.map((_,i)=>x0+i*sp);
  let g='';G0.notes.forEach((nn,i)=>{g+=`<g class="${i<this.ni?'n-perfect':''}" ${i>this.ni?'opacity=".55"':''}>${noteSVG(nn.pos,nn.a||null,this.xs[i],2,!!nn.a)}</g>`;if(i===this.ni)g+=`<circle cx="${this.xs[i]}" cy="${yP(nn.pos)}" r="15" fill="none" stroke="#ffd23f" stroke-width="2.5" style="filter:drop-shadow(0 0 8px #ffd23f)"/>`});
  const a=this.xs[0],b=this.xs[n-1],top=Math.min(...G0.notes.map(q=>yP(q.pos)))-40;
  svg.innerHTML=DEFS+staff(0,w)+clef(4)+`<path d="M${a} ${top+18} Q${(a+b)/2} ${top-22} ${b} ${top+18}" fill="none" stroke="#ff2e88" stroke-width="2.5" style="filter:drop-shadow(0 0 4px #ff2e88)"/>`+g+
   `<g>${valves(w-70,30,G0.c,9)}</g><text x="${w-70}" y="70" text-anchor="middle" style="font:500 12px Rubik,sans-serif;fill:#a59cc8">${t('valvesL')}</text><text x="12" y="${h-12}" class="lab" style="font-size:13px">${this.gi+1}/${this.groups.length}</text><g id="flg"></g>`},
 update(p){const g=$('#flg');if(!g||this.state==='end')return;const dt=dtOf(this),G0=this.groups[this.gi],tg=G0.notes[this.ni];if(!tg)return;
  g.innerHTML=p?`<path class="ghost" d="M${this.xs[this.ni]-30} ${yM(p.w)} l8 -6 l8 6 l-8 6z"/>`:'';
  if(p&&Math.abs(p.w-tg.midi)<.5)this.hold+=dt;else this.hold=Math.max(0,this.hold-dt);
  if(this.hold>.15){this.hold=0;FX.burst(this.xs[this.ni],yP(tg.pos),'#3dff8a',12,3);this.ni++;if(this.ni>=G0.notes.length)this.adv(true);else this.build()}},
 adv(ok){const el=(performance.now()-this.tA)/1000;this.times.push(ok?el:null);if(ok){this.combo++;const mu=Math.min(4,1+Math.floor(this.combo/2));setMult(mu);this.score+=Math.max(20,Math.round(150-el*15))*mu;setPts(this.score);ding();flash();fb(t('perfect'),'var(--ok)')}else{this.combo=0;setMult(1)}
  this.gi++;this.ni=0;this.hold=0;if(this.gi>=this.groups.length)return this.finish();this.tA=performance.now();this.build()},
 finish(){this.state='end';const ts=this.times,ok=ts.filter(x=>x!=null),tot=ok.reduce((a,b)=>a+b,0);let wi=-1,wv=-1;ts.forEach((x,i)=>{const v=x==null?99:x;if(v>wv){wv=v;wi=i}});
  const lab=c=>c==='0'?'0':c.split('').join('-');
  modal(t('result'),[[t('score'),this.score],[t('total'),tot.toFixed(1)+' s'],[t('accuracy'),ok.length+'/'+ts.length]],wi>=0?[t('tipSlowV',{v:t('valvesL')+' '+lab(this.groups[wi].c)})]:[],()=>this.round(),null,ok.length<ts.length?2:tot<ts.length*2?5:tot<ts.length*4?4:3)},
 stop(){this.state='end'}};

/* ===== ECO ===== */
const EC={N:8,
 init(){this.round()},
 round(){const pool=freePool().filter(n=>S.level===2||!n.a),len=[3,4,5][S.level],mx=[2,2,3][S.level];this.ph=[];
  for(let k=0;k<this.N;k++){let i=Math.floor(pool.length/2+(Math.random()-.5)*pool.length*.6);const ph=[pool[i]];
   while(ph.length<len){let st=(1+Math.floor(Math.random()*mx))*(Math.random()<.5?-1:1);let j=i+st;if(j<0||j>=pool.length)j=i-st;if(j<0||j>=pool.length)continue;i=j;ph.push(pool[i])}this.ph.push(ph)}
  this.i=0;this.score=0;this.first=0;this.combo=0;setMult(1);
  ctrl(`<button class="big" id="ecL">${t('listen')}</button><button class="ib" id="ecS">${t('skip')}</button>`);$('#ecL').onclick=()=>this.play();$('#ecS').onclick=()=>this.next(false);setPts(0);this.start()},
 build(rev){const w=W(),h=270,P=this.ph[this.i],n=P.length;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('height',h);
  const x0=90,sp=Math.min(70,(w-x0-30)/Math.max(1,n-1));let g='';
  if(rev)P.forEach((q,k)=>g+=`<g class="n-perfect">${noteSVG(q.pos,q.a||null,x0+k*sp,1,!!q.a)}</g>`);
  const slots=P.map((q,k)=>{const c=this.cap[k];const col=c==null?'#251d45':c===q.midi?'#3dff8a':'#ff3b5c';return`<circle cx="${w/2+(k-(n-1)/2)*34}" cy="${h-26}" r="11" fill="${col}" stroke="#3dff8a" stroke-opacity=".6" stroke-width="2"/>`}).join('');
  svg.innerHTML=DEFS+staff(0,w)+clef(4)+g+slots+`<text x="12" y="24" class="lab">${t('first',{n:nname(P[0])})}</text><text x="${w-12}" y="24" text-anchor="end" class="lab">${t('phrases')} ${this.i+1}/${this.N}</text>`},
 start(){this.cap=[];this.tries=0;this.build(false);later(()=>this.play(),500)},
 play(){const P=this.ph[this.i],tr=typ().tr;this.state='play';this.cap=[];this.build(false);fb(t('listening'));PD.mute(P.length*.55+.5);P.forEach((q,k)=>later(()=>tone(q.midi-tr,.45),k*550));
  later(()=>{if(this.state==='play'){this.state='listen';this.cand=null;this.ct=0;this.sil=1;this.taken=false;fb(t('yourTurn'))}},P.length*550+250)},
 update(p){const dt=dtOf(this);if(this.state!=='listen')return;
  if(p){const r=Math.round(p.w);if(Math.abs(p.w-r)<.4){if(r===this.cand)this.ct+=dt;else{this.cand=r;this.ct=0;this.taken=false}
    if(this.ct>.12&&!this.taken){this.taken=true;this.cap.push(r);this.check()}}this.sil=0}
  else{this.sil+=dt;if(this.sil>.08){this.taken=false;this.cand=null}}},
 check(){const P=this.ph[this.i],k=this.cap.length-1;this.build(false);
  if(this.cap[k]!==P[k].midi){this.tries++;this.state='wrong';fb(t('wrongN'),'var(--verm)');this.combo=0;setMult(1);later(()=>{this.cap=[];this.build(false);this.state='listen';fb(t('yourTurn'))},900);return}
  if(this.cap.length===P.length){this.state='hit';if(!this.tries){this.first++;this.combo++}const mu=Math.min(4,1+Math.floor(this.combo/2));setMult(mu);this.score+=(this.tries?50:120)*mu;setPts(this.score);
   fb(this.tries?t('good'):t('perfect'),'var(--ok)');ding();flash();this.build(true);FX.burst(W()/2,200,'#3dff8a',30,5);later(()=>this.next(true),1600)}},
 next(){this.i++;if(this.i>=this.N)return this.finish();this.start()},
 finish(){this.state='end';modal(t('result'),[[t('score'),this.score],[t('firstTry'),this.first+'/'+this.N],[t('phrases'),this.N]],[],()=>this.round(),null,Math.max(1,Math.min(5,Math.round(this.first/this.N*5))))},
 stop(){this.state='end'}};

/* ===== RANKING ===== */
const RK={g:'g1',
 init(){svg.setAttribute('viewBox','0 0 10 0');svg.setAttribute('height',0);this.draw()},
 async draw(){ctrl('');const st=$('#stage');
  const chips=(arr,curV,attr)=>`<div class="chips" style="margin-bottom:10px">${arr.map(([v,l])=>`<button class="chip" ${attr}="${v}" aria-pressed="${v===curV}">${l}</button>`).join('')}</div>`;
  $('#gStat').textContent='';
  let box=$('#rkBox');if(!box){box=document.createElement('div');box.id='rkBox';box.className='card';box.style.marginTop='10px';st.after(box)}
  box.innerHTML=chips(['g1','g2','g3','f1','f2','f3','f4'].map(x=>[x,t(x)]),this.g,'data-rg')+chips(LEVELS.map((l,i)=>[i,t('L'+(i+1))]),S.level,'data-rl')+
   `<p class="help" style="margin:0">${t('k_'+typ().k)} ${typ().key} · ${t('player')}: <b>${esc(S.name||'—')}</b> <button class="ib" id="rkName" style="min-height:36px;margin-left:6px">${t('change')}</button></p><div id="rkList"><p class="sv">…</p></div>`;
  box.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{this.g=b.dataset.rg;this.draw()});
  box.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{S.level=+b.dataset.rl;save();this.draw()});
  $('#rkName').onclick=()=>{$('#rkList').innerHTML=`<div class="nm"><input id="rkIn" maxlength="24" value="${esc(S.name||'')}"><button class="big alt" id="rkOk">${t('saveB')}</button></div>`;$('#rkOk').onclick=()=>{const v=$('#rkIn').value.trim().slice(0,24);if(v){S.name=v;save()}this.draw()}};
  try{const top=await topList(this.g,S.level,S.type);let mine=[];
   if(S.name)mine=await sb(`toca_resultados?select=puntos,precision,created_at&xogo=eq.${this.g}&nivel=eq.${S.level}&tipo=eq.${S.type}&xogador=eq.${encodeURIComponent(S.name)}&order=created_at.desc&limit=10`);
   const L=$('#rkList');if(!L)return;L.innerHTML=`<h2 style="margin-top:14px">${t('top')} 10</h2>${rankHTML(top,S.name)}`+(S.name?`<h2>${t('myLast')}</h2>${mine.length?`<ul class="hist">${mine.map(r=>`<li><span>${new Date(r.created_at).toLocaleString(S.lang,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><b>${r.puntos}${r.precision!=null?` · ${r.precision}%`:''}</b></li>`).join('')}</ul>`:`<p class="help">${t('empty')}</p>`}`:'')}
  catch(e){console.warn(e);const L=$('#rkList');L&&(L.innerHTML=`<p class="sv err">${t('offline')}</p>`)}},
 update(){},stop(){const b=$('#rkBox');b&&b.remove()}};
const GAMES={g1:R,g2:X,g3:D,f1:TN,f2:DY,f3:FL,f4:EC,tu:TU,me:ME,rk:RK};
function loop(){requestAnimationFrame(loop);FX.step();const p=PD.on?PD.read():null;

  if(!$('#setup').classList.contains('hidden'))tuner($('#tun1'),p)}
